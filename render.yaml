services:
  - type: web
    name: dealpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealpilot-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: dealpilot-frontend
          property: host
      - key: WORKSPACE_TOKEN
        value: l23kTxGL6jBc21F0AMTvB2A6VYJfzco0VcqBqsZxTlbz2qGi
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

  - type: web
    name: dealpilot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: INTERNAL_BACKEND_URL
        fromService:
          type: web
          name: dealpilot-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: dealpilot-db
    plan: free
    region: oregon
    databaseName: dealpilot
    user: dealpilot
